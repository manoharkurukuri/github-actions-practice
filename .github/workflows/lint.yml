name: Auto Linter

on:
  push:
    paths: "*.py" 


jobs:
  code:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: check python version
        run: python --version
        
      - name: Install Linter
        run: pip install ruff

      - name: check the files for linting
        run: ruff check .




        
        

        

        
      
